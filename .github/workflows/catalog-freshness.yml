name: catalog-freshness

# The price attestations in config/catalog.yaml expire, and when the oldest one
# passes -max-price-age the gateway stops starting. That is the correct
# behaviour — every figure this product reports is arithmetic over those prices —
# but on its own it means a deployment nobody touched dies without warning, with
# an error about a date in a YAML file.
#
# This job asks the same question two weeks early, on a schedule, so the expiry
# arrives as a chore ticket rather than as an incident.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["config/catalog.yaml"]

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 1848h = 76 days = the 90-day production window minus a fortnight.
      - name: prices must have at least 14 days left
        run: |
          if ! go run ./cmd/relay -validate -max-price-age 1848h; then
            echo
            echo "::error::A price attestation is within 14 days of stopping the gateway."
            echo "Re-verify each price against the source URL printed above, update"
            echo "pricing.verified_on in config/catalog.yaml, and the clock resets."
            exit 1
          fi
